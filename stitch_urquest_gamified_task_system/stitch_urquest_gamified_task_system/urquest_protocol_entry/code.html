<style>
        .bg-grid-pattern {
            background-size: 32px 32px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        }
        
        @keyframes glitch {
            0% { transform: translate(0) }
            20% { transform: translate(-2px, 2px) }
            40% { transform: translate(-2px, -2px) }
            60% { transform: translate(2px, 2px) }
            80% { transform: translate(2px, -2px) }
            100% { transform: translate(0) }
        }
        
        .hover-glitch:hover {
            animation: glitch 0.3s cubic-bezier(.25, .46, .45, .94) both infinite;
            background-color: var(--color-primary-fixed-dim);
            color: var(--color-on-primary-fixed);
        }
        
        .neon-glow {
            box-shadow: 0 0 10px rgba(0, 220, 230, 0.5), inset 0 0 5px rgba(0, 220, 230, 0.3);
        }
        
        .glass-panel {
            background-color: #1a1a1c;
            border: 1px solid #3a3a3c;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.05);
        }
        
        .btn-3d {
            box-shadow: 0 4px 6px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            transition: all 0.2s ease;
        }
        
        .btn-3d:active {
            box-shadow: 0 1px 2px rgba(0,0,0,0.5), inset 0 1px 3px rgba(0,0,0,0.3);
            transform: translateY(2px);
        }

<body class="bg-[#111] text-on-background min-h-screen relative overflow-hidden font-body-md flex items-center justify-center">
<!-- Ambient Background Effect -->
<div class="absolute inset-0 z-0 bg-grid-pattern pointer-events-none opacity-50"></div>
<div class="absolute inset-0 z-0 opacity-10 pointer-events-none" style="background: radial-gradient(circle at 50% 50%, var(--color-primary-fixed-dim) 0%, transparent 60%); blur(100px);"></div>
<!-- Main Auth Module -->
<main class="relative z-10 w-full max-w-md px-margin-mobile md:px-0">
<!-- Header -->
<header class="text-center mb-10">
<h1 class="font-display-lg text-display-lg text-primary tracking-tighter uppercase relative inline-block group">
<span class="relative z-10 drop-shadow-[0_0_8px_rgba(227,253,255,0.8)]">URQUEST</span>
<span class="absolute top-0 left-[2px] text-secondary opacity-50 mix-blend-screen -z-10 group-hover:animate-[glitch_0.2s_infinite]">URQUEST</span>
<span class="absolute top-0 -left-[2px] text-tertiary-container opacity-50 mix-blend-screen -z-10 group-hover:animate-[glitch_0.3s_infinite_reverse]">URQUEST</span>
</h1>
<p class="font-label-caps text-label-caps text-on-surface-variant mt-2 tracking-[0.2em] font-bold">// SYSTEM ACCESS</p>
</header>
<!-- Auth Card -->
<div class="glass-panel p-8 rounded-xl relative overflow-hidden group">
<!-- Decorative corner accent -->
<div class="absolute top-0 right-0 w-8 h-8 border-t-2 border-r-2 border-outline-variant opacity-50"></div>
<div class="absolute bottom-0 left-0 w-8 h-8 border-b-2 border-l-2 border-outline-variant opacity-50"></div>
<!-- Role Toggle -->
<div class="flex p-1 bg-surface-container-lowest rounded-lg mb-8 border border-outline-variant/50 input-recessed">
<button class="flex-1 py-2 font-label-caps text-label-caps text-on-primary bg-primary rounded-md shadow-[0_2px_10px_rgba(0,220,230,0.4),inset_0_1px_0_rgba(255,255,255,0.5)] transition-all font-bold">
                    AGENT
                </button>
<button class="flex-1 py-2 font-label-caps text-label-caps text-on-surface-variant hover:text-on-surface transition-colors font-bold">
                    ORGANIZATION
                </button>
</div>
<!-- OAuth Button -->
<button class="w-full mb-6 flex items-center justify-center gap-3 py-3 bg-[#222224] border border-[#333] rounded-lg hover:border-outline transition-all duration-300 relative overflow-hidden group/btn btn-3d">
<span class="material-symbols-outlined text-[20px] text-on-surface">account_circle</span>
<span class="font-body-md font-bold text-on-surface tracking-wide uppercase text-sm">CONTINUE WITH GOOGLE</span>
</button>

<div class="flex items-center gap-4 mb-6">
<div class="h-px bg-outline-variant/50 flex-1"></div>

</div>

<form class="space-y-5">

<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline-variant group-focus-within/input:text-primary transition-colors">mail</span>
<input class="w-full bg-[#151517] border border-[#333] rounded-lg py-3 pl-10 pr-4 text-on-surface font-body-md focus:outline-none focus:border-primary focus:shadow-[0_0_8px_rgba(0,220,230,0.4)] transition-all placeholder:text-outline-variant placeholder:font-label-caps input-recessed" placeholder="EMAIL ADDRESS" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="relative group/input">
<label class="absolute -top-2.5 left-3 bg-[#1a1a1c] px-1 font-label-caps text-label-caps text-primary opacity-0 group-focus-within/input:opacity-100 transition-opacity z-10">ACCESS CODE</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline-variant group-focus-within/input:text-primary transition-colors">lock</span>
<input class="w-full bg-[#151517] border border-[#333] rounded-lg py-3 pl-10 pr-4 text-on-surface font-body-md focus:outline-none focus:border-primary focus:shadow-[0_0_8px_rgba(0,220,230,0.4)] transition-all placeholder:text-outline-variant placeholder:font-label-caps input-recessed" placeholder="PASSWORD" type="password"/>
<button class="absolute right-3 text-outline-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>

</div>
</div>
<div class="flex justify-between items-center mt-2">

</div>
<span class="font-label-caps text-label-caps text-on-surface-variant group-hover/cb:text-on-surface transition-colors font-bold">REMEMBER ME</span>
</label>

</div>

</button>

<div class="mt-8 text-center">
