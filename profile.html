<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UrQuest - Agent Profile</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }
        .profile-container {
            width: 100%;
            max-width: 800px;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 20px;
        }
    </style>
</head>
<body class="dark-theme">
    <div class="profile-container">
        <div class="header-top">
            <h2 class="brand"><span class="brand-accent">UR</span>QUEST</h2>
            <button class="btn-ghost" onclick="window.location.href='index.html'">RETURN TO BASE</button>
        </div>
        
        <div class="glass-panel" style="padding: 40px; margin-bottom:20px; text-align:center;">
            <div style="width: 100px; height: 100px; border-radius: 50%; background: var(--color-surface-container-high); margin: 0 auto 20px auto; border: 2px solid var(--color-primary); display: flex; align-items: center; justify-content: center;">
                <span class="material-symbols-outlined" style="font-size: 50px; color: var(--color-primary);">person</span>
            </div>
            <h1 id="pub-username" style="margin:0; font-family:var(--font-headline); color:var(--color-on-surface);">SCANNING...</h1>
            <p id="pub-role" style="color:var(--color-primary); font-family:var(--font-label); letter-spacing:0.1em; margin-top:5px;">ROLE</p>
            
            <div style="display:flex; justify-content:center; gap:20px; margin-top:30px;">
                <div class="stat-box input-recessed" style="flex:1;">
                    <div class="stat-box-label">LEVEL</div>
                    <div class="stat-box-value" id="pub-level">0</div>
                </div>
                <div class="stat-box input-recessed" style="flex:1;">
                    <div class="stat-box-label">TOTAL XP</div>
                    <div class="stat-box-value" id="pub-xp">0</div>
                </div>
                <div class="stat-box input-recessed" style="flex:1;">
                    <div class="stat-box-label">GLOBAL RANK</div>
                    <div class="stat-box-value" id="pub-rank">#0</div>
                </div>
            </div>
        </div>

        <div class="glass-panel" style="padding: 20px; margin-bottom:20px;">
            <h3 style="color:var(--color-primary); margin-top:0;">ACQUIRED BADGES</h3>
            <div id="pub-badges" style="display:flex; gap:10px; flex-wrap:wrap;">
                <!-- Badges injected here -->
            </div>
        </div>

        <div class="glass-panel" style="padding: 20px;">
            <h3 style="color:var(--color-primary); margin-top:0;">MISSION HISTORY</h3>
            <div id="pub-history" style="display:flex; flex-direction:column; gap:10px;">
                <!-- History injected here -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const userId = urlParams.get('id');
            if (!userId) {
                document.getElementById('pub-username').innerText = "AGENT NOT FOUND";
                return;
            }
            
            try {
                // Fetch Profile
                const profile = await app.request(`/api/user/profile?user_id=${userId}`);
                document.getElementById('pub-username').innerText = profile.username.toUpperCase();
                document.getElementById('pub-role').innerText = profile.role_name ? profile.role_name.toUpperCase() : "INDEPENDENT AGENT";
                document.getElementById('pub-level').innerText = profile.level;
                document.getElementById('pub-xp').innerText = profile.total_xp;
                document.getElementById('pub-rank').innerText = `#${profile.rank}`;
                
                const historyContainer = document.getElementById('pub-history');
                if (profile.history && profile.history.length > 0) {
                    historyContainer.innerHTML = profile.history.map(h => `
                        <div style="padding: 10px; background: var(--color-surface-container); border-radius: 8px; display:flex; justify-content:space-between; align-items:center;">
                            <span style="color:var(--color-on-surface); font-family:var(--font-headline);">${h.title}</span>
                            <span style="color: ${h.status === 'APPROVED' ? 'var(--color-primary)' : 'var(--color-outline-variant)'}; font-family:var(--font-label); font-size:12px;">${h.status}</span>
                        </div>
                    `).join('');
                } else {
                    historyContainer.innerHTML = '<span style="color:var(--color-outline-variant); font-size:12px;">NO HISTORY</span>';
                }

                // Fetch Badges
                const badges = await app.request(`/api/user/badges?user_id=${userId}`);
                const badgesContainer = document.getElementById('pub-badges');
                if (badges && badges.length > 0) {
                    badgesContainer.innerHTML = badges.map(b => `
                        <div class="badge" title="${b.description}" style="background:var(--color-surface-container-high); color:var(--color-primary); padding:6px 12px; font-size:12px; display:flex; align-items:center; gap:5px; border-radius:4px; border:1px solid var(--color-primary-fixed-dim);">
                            <span class="material-symbols-outlined" style="font-size:16px;">${b.icon}</span>
                            ${b.name}
                        </div>
                    `).join('');
                } else {
                    badgesContainer.innerHTML = '<span style="color:var(--color-outline-variant); font-size:12px;">NO BADGES YET</span>';
                }

            } catch(e) {
                document.getElementById('pub-username').innerText = "ERROR LOADING PROFILE";
            }
        });
    </script>
</body>
</html>
