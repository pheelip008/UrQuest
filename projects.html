<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UrQuest - Projects</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
</head>
<body>
    <div class="bg-grid-pattern"></div>
    <div class="scanline"></div>

    <header class="top-app-bar">
        <div class="brand">
            <span class="brand-name">URQUEST</span>
            <span class="brand-sub">// PROJECT COMMAND</span>
        </div>
        <div class="bar-right">
            <span id="project-username" style="font-family:var(--font-label); font-size:11px; color:var(--color-primary); letter-spacing:0.1em;"></span>
            <a class="btn-3d" href="user-dashboard.html" style="margin-left:16px; padding:8px 20px;">QUEST BOARD</a>
        </div>
        <div class="bar-glow"></div>
    </header>

    <main style="position:relative; z-index:1; max-width:1180px; margin:110px auto 48px; padding:0 24px;">
        <div class="page-header">
            <div>
                <h1><span class="accent-bar"></span>PROJECTS</h1>
                <p class="subtitle">Deploy public operations and monitor your active projects.</p>
            </div>
        </div>

        <section style="display:grid; grid-template-columns:minmax(280px, 0.9fr) minmax(0, 1.4fr); gap:24px; align-items:start;">
            <div class="glass-panel corner-accents" style="padding:24px; border-radius:12px;">
                <h2 style="margin:0 0 6px; font-size:20px;">DEPLOY PROJECT</h2>
                <p style="color:var(--color-outline-variant); font-size:13px; margin:0 0 20px;">Publish a public quest for other agents to request.</p>
                <form id="project-create-form">
                    <div class="form-group">
                        <label>PROJECT TITLE</label>
                        <input id="project-title" class="cyber-input" required maxlength="140" placeholder="E.G. API DOCUMENTATION">
                    </div>
                    <div class="form-group">
                        <label>BRIEFING</label>
                        <textarea id="project-description" class="cyber-input" required rows="4" placeholder="DESCRIBE THE OBJECTIVE"></textarea>
                    </div>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                        <div class="form-group">
                            <label>XP REWARD</label>
                            <input id="project-xp" class="cyber-input" required type="number" min="1" value="50">
                        </div>
                        <div class="form-group">
                            <label>DIFFICULTY</label>
                            <select id="project-difficulty" class="cyber-input">
                                <option value="Easy">EASY</option>
                                <option value="Medium" selected>MEDIUM</option>
                                <option value="Hard">HARD</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>CATEGORY</label>
                        <input id="project-category" class="cyber-input" placeholder="E.G. DEVELOPMENT">
                    </div>
                    <div class="form-group">
                        <label>DEADLINE (OPTIONAL)</label>
                        <input id="project-deadline" class="cyber-input" type="datetime-local">
                    </div>
                    <button type="submit" class="btn-3d-primary" style="width:100%; padding:12px;">DEPLOY PROJECT</button>
                </form>
            </div>

            <div style="display:flex; flex-direction:column; gap:24px;">
                <div class="glass-panel" style="padding:20px; border-radius:12px;">
                    <h2 style="margin:0 0 6px; font-size:20px;">ACCEPTANCE REQUESTS</h2>
                    <p style="color:var(--color-outline-variant); font-size:13px; margin:0 0 16px;">Approve an agent before they can work on your project.</p>
                    <div id="project-request-list" style="display:flex; flex-direction:column; gap:10px;"></div>
                </div>
                <div>
                    <h2 style="margin:0 0 14px; font-size:20px;">YOUR DEPLOYED PROJECTS</h2>
                    <div id="project-list" style="display:flex; flex-direction:column; gap:14px;"></div>
                </div>
            </div>
        </section>
    </main>

    <div id="notification-area" style="position:fixed; bottom:20px; right:20px; z-index:200;"></div>
    <script src="app.js"></script>
    <script>document.addEventListener('DOMContentLoaded', () => app.initProjects());</script>
</body>
</html>
